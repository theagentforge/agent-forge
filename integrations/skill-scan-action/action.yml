name: Forge skill scan
description: Scans agent skill files in PRs for hidden instructions and key theft. No file leaves GitHub; sends nothing by default.
author: The Agent Forge
branding:
  icon: shield
  color: orange
inputs:
  paths:
    description: Files to scan, as globs, one per line. Default SKILL.md, AGENTS.md, CLAUDE.md and GEMINI.md anywhere, Claude Code commands, agents and rules, .cursor/rules/**, .cursorrules, .windsurfrules and GitHub Copilot instructions.
    required: false
    default: ""
  ignore:
    description: Globs to skip, one per line (node_modules, vendor and dist are always skipped). Handy for security courses and test fixtures that quote attacks on purpose.
    required: false
    default: ""
  changed-only:
    description: "auto (default: only the files a pull request changed; everything on other events), true or false."
    required: false
    default: auto
  fail-on:
    description: "high (default: fail on high-severity findings), medium (also medium), or never (report only)."
    required: false
    default: high
  comment:
    description: "auto (default: one pull request comment, edited in place, when there's something to say and the token may write) or never."
    required: false
    default: auto
  sarif-file:
    description: Also write the findings as SARIF to this path, for github/codeql-action/upload-sarif (needs security-events write).
    required: false
    default: ""
  github-token:
    description: Token for listing the pull request's files and writing its comment.
    required: false
    default: ${{ github.token }}
  origin:
    description: Forge address, for the links in the comment.
    required: false
    default: https://theagentforge.io
  state-file:
    description: "A file for the last run's results, so the job summary says what changed since then (newer scan rules, changed files, findings that appeared or went away). Keep it between runs with actions/cache, for example ${{ runner.temp }}/forge-skill-scan-state.json; don't commit it. Default empty: no memory."
    required: false
    default: ""
  count-run:
    description: "false (default) sends nothing. true (opt-in) sends one anonymous count per run to The Forge (theagentforge.io/api/v1/install-outcome) with the outcome only (blocked, findings or clear): no file, path, finding, repository or account. Like any web request it reaches The Forge from the runner's network address, which Cloudflare's request logs keep for up to 7 days; the count itself stores none. DO_NOT_TRACK=1 in the job's environment always wins: nothing is sent even with true."
    required: false
    default: "false"
outputs:
  files:
    description: How many files were scanned.
  high:
    description: High-severity findings.
  medium:
    description: Medium-severity findings.
  low:
    description: Low-severity findings.
  verdict:
    description: flagged, caution or clear.
runs:
  using: node24
  main: dist/index.mjs
